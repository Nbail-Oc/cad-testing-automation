<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>text-to-cad live preview</title>
<style>
  body { margin: 0; background: #111820; color: #dce7ee; font: 16px system-ui, sans-serif; }
  header { padding: 18px 24px; border-bottom: 1px solid #2a3944; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0; color: #9fb0ba; }
  main { display: grid; place-items: center; padding: 24px; }
  img { max-width: min(1200px, 94vw); max-height: 78vh; border: 1px solid #415462; background: #eef3f7; }
  .live { color: #68e0a0; }
</style>
<header>
  <h1>text-to-cad <span class="live">● LIVE</span></h1>
  <p>Mounting plate preview · refreshes automatically while the CAD snapshot is rebuilt.</p>
</header>
<main><img id="cad" src="cad_smoke_plate_live.png" alt="Live CAD preview"></main>
<script>
  const image = document.getElementById('cad');
  setInterval(() => { image.src = 'cad_smoke_plate_live.png?t=' + Date.now(); }, 1500);
</script>
</html>
